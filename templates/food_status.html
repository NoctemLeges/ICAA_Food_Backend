{% extends "base.html" %}

{% block content %}
    <div class="card">

        <h1 class="{{ css_class }}">{{ heading }}</h1>

        {% if name %}
            <p><b>Name:</b> {{ name }}</p>
        {% endif %}

        {% if id %}
            <p><b>ID:</b> {{ id }}</p>
        {% endif %}

        <p class="subtext">{{ message }}</p>

    </div>
{% endblock %}
